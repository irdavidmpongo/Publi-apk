name: Créer keystore (une seule fois)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Générer le keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore release.keystore \
            -alias jasonbook -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Jason Book"
          {
            echo "KEYSTORE_PASSWORD:"
            echo "$PASS"
            echo ""
            echo "KEYSTORE_BASE64:"
            base64 -w 0 release.keystore
            echo ""
          } > secrets.txt

      - name: Upload (supprime-le après usage !)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
