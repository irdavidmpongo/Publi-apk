name: Build Jason Book APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Jason Book"
  APP_ID: "com.jasonbook.app"
  SITE_URL: "https://jason-chat-mu.vercel.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier l'icône et les secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "❌ assets/icon.png introuvable (PNG 1024x1024 requis)"
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "❌ Secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD manquants."
            echo "Lance d'abord le workflow 'Créer keystore' puis ajoute les secrets."
            exit 1
          fi

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Initialiser le projet Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install -D @capacitor/assets@3
          mkdir -p www
          cat > www/index.html <<'EOF2'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=${{ env.SITE_URL }}">
            <title>Jason Book</title>
            <style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}</style>
          </head>
          <body>Chargement de Jason Book…</body>
          </html>
          EOF2
          cat > capacitor.config.json <<EOF2
          {
            "appId": "${{ env.APP_ID }}",
            "appName": "${{ env.APP_NAME }}",
            "webDir": "www",
            "server": {
              "url": "${{ env.SITE_URL }}",
              "cleartext": false,
              "androidScheme": "https",
              "allowNavigation": ["jason-chat-mu.vercel.app", "*.vercel.app"]
            },
            "android": {
              "backgroundColor": "#000000"
            }
          }
          EOF2

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Générer les icônes Android
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#000000' \
            --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' \
            --splashBackgroundColorDark '#000000'

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer signature et version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'
          s = open(p).read()
          n = os.environ['RUN_NUMBER']
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + n, s)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.' + n + '"', s)
          s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                     r'\1\n            signingConfig signingConfigs.release', s, count=1)
          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_PATH"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          '''
          s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)
          assert 'signingConfig signingConfigs.release' in s, 'patch signature échoué'
          assert 'versionCode ' + n in s, 'patch version échoué'
          open(p, 'w').write(s)
          PY

      - name: Build APK signé (release)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: jasonbook
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/JasonBook.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JasonBook-APK
          path: output/JasonBook.apk

      - name: Publier dans les Releases GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Jason Book v${{ github.run_number }}
          files: output/JasonBook.apk
